server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # vacation photos can be up to 5 MB (nginx allows only 1 MB by default)
  client_max_body_size 6m;

  # /api/... → the Express server; the /api prefix is removed (/api/vacations → /vacations)
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # an AI answer can take a while (the server stops waiting for Gemini after 25 s, then tries the backup model)
    proxy_read_timeout 90s;
  }

  # React Router: every other address returns index.html (so a refresh on /admin works)
  location / {
    try_files $uri /index.html;
  }
}
